[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-piper-teleop"
version = "0.1.0"
description = "Compact PICO teleoperation and synchronized RGB-D capture for one AgileX PiPER"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "placo==0.9.23",
  "pyrealsense2==2.58.2.10647",
]

[project.scripts]
piper-teleop = "single_piper_teleop.teleop:main"
piper-validate = "single_piper_teleop.validate:main"
piper-recover = "single_piper_teleop.recover:main"
piper-preflight = "single_piper_teleop.preflight:main"

[tool.setuptools]
packages = ["single_piper_teleop"]
