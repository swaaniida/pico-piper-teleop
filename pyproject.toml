[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-piper-tracer-teleop"
version = "0.2.0"
description = "Synchronized PICO teleoperation and camera capture for PiPER and Tracer Mini"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "placo==0.9.23",
  "opencv-python-headless==5.0.0.93",
]

[project.scripts]
piper-teleop = "single_piper_teleop.teleop:main"
piper-validate = "single_piper_teleop.validate:main"
piper-recover = "single_piper_teleop.recover:main"
piper-preflight = "single_piper_teleop.preflight:main"
tracer-teleop = "tracer_mini.pico_teleop:main"

[tool.setuptools]
packages = ["single_piper_teleop", "tracer_mini"]
